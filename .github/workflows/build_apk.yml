
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Build APK
        run: |
          PROJECT_DIR=$(find "$GITHUB_WORKSPACE" -maxdepth 2 -name "pubspec.yaml" -not -path "*/\.*" | head -1 | xargs dirname)
          echo "Found project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/app-release.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: punchline-apk
          path: app-release.apk
