name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create project and build
        run: |
          flutter create temp_project --platforms android
          cp -r lib/* temp_project/lib/
          cp pubspec.yaml temp_project/
          cd temp_project
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: punchline-apk
          path: temp_project/build/app/outputs/flutter-apk/app-release.apk
