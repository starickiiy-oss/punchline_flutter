name: Build Punchline APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Create Flutter Project
        run: |
          flutter config --no-analytics
          flutter create --project-name punchline --org com.example punchline_app
          cp lib/main.dart punchline_app/lib/main.dart
          cd punchline_app
          flutter pub add shared_preferences

      - name: Flutter Doctor (diagnostics)
        run: flutter doctor -v

      - name: Build Release APK
        run: |
          cd punchline_app
          flutter build apk --release

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: punchline-apk
          path: punchline_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            punchline_app/android/app/build.gradle
            punchline_app/build/app/outputs/logs/
