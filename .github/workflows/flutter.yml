    return Container(
      margin: const EdgeInsets.only(bottom: 12),
      decoration: BoxDecoration(
        color: kSurface.withOpacity(0.85),
        borderRadius: BorderRadius.circular(radius ?? 20),
        border: Border.all(color: Colors.white.withOpacity(0.06)),
